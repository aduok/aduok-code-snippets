<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Glass Navigation</title>
<style>
  /* =========================================================
     TOKENS
     ========================================================= */
  :root {
    --bg: #eef1f6;
    --blob-a: #ff375f;
    --blob-b: #0a84ff;
    --blob-c: #ffd60a;
    --blob-opacity: 0.5;

    --glass-bg: rgba(255, 255, 255, 0.16);
    --glass-border: rgba(255, 255, 255, 0.55);
    --glass-shadow: rgba(20, 20, 40, 0.16);

    --pill-bg: rgba(255, 255, 255, 0.75);
    --pill-shadow: 0 6px 16px rgba(20, 20, 40, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    --glare-color: rgba(255, 255, 255, 0.5);
    --metaball-bg: rgba(255, 255, 255, 0.75);

    --ink-dim: rgba(20, 20, 30, 0.5);
    --ink: rgba(15, 15, 25, 0.94);
    --divider: rgba(20, 20, 30, 0.14);

    --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  [data-theme="dark"] {
    --bg: #050506;
    --blob-a: #bf5af2;
    --blob-b: #30d5c8;
    --blob-c: #ff6b4a;
    --blob-opacity: 0.3;

    --glass-bg: rgba(28, 28, 32, 0.5);
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-shadow: rgba(0, 0, 0, 0.7);

    --pill-bg: rgba(70, 70, 76, 0.85);
    --pill-shadow: 0 6px 16px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.16);
    --glare-color: rgba(255, 255, 255, 0.15);
    --metaball-bg: rgba(70, 70, 76, 0.85);

    --ink-dim: rgba(255, 255, 255, 0.5);
    --ink: #ffffff;
    --divider: rgba(255, 255, 255, 0.14);
  }

  /* =========================================================
     RESET & STAGE
     ========================================================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .mesh {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: var(--blob-opacity);
    will-change: transform;
    animation: drift 24s infinite alternate var(--ease-out);
    transition: background 0.6s ease, opacity 0.6s ease;
  }
  .blob-a { width: 46vw; height: 46vw; top: -12%; left: -10%; background: var(--blob-a); }
  .blob-b { width: 42vw; height: 42vw; bottom: -14%; right: -8%; background: var(--blob-b); animation-delay: -8s; }
  .blob-c { width: 30vw; height: 30vw; top: 32%; left: 42%; background: var(--blob-c); animation-delay: -16s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(6%, 8%) scale(1.08); }
    100% { transform: translate(-6%, -6%) scale(0.96); }
  }

  /* =========================================================
     NAV SHELL
     ========================================================= */
  .liquid-nav {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-bg);
    backdrop-filter: blur(36px) saturate(180%);
    -webkit-backdrop-filter: blur(36px) saturate(180%);
    box-shadow:
      0 30px 60px -18px var(--glass-shadow),
      0 8px 20px -8px var(--glass-shadow),
      inset 0 0 0 1px var(--glass-border);
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }

  /* interactive light that follows the cursor across the whole glass surface */
  .liquid-glare-container {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    overflow: hidden;
    pointer-events: none;
    z-index: 5;
  }

  .liquid-glare {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s ease;
    background: radial-gradient(circle 90px at var(--x, 50%) var(--y, 50%), var(--glare-color) 0%, transparent 100%);
    mix-blend-mode: overlay;
  }

  .liquid-nav:hover .liquid-glare { opacity: 1; }

  /* =========================================================
     TABS
     ========================================================= */
  .tabs {
    position: relative;
    display: flex;
    gap: 2px;
    z-index: 3;
  }

  .active-pill {
    position: absolute;
    top: 0; left: 0;
    height: 44px;
    border-radius: 999px;
    background: var(--pill-bg);
    box-shadow: var(--pill-shadow);
    z-index: 1;
    transition:
      transform 0.5s var(--ease-spring),
      width 0.5s var(--ease-spring),
      background 0.4s ease, box-shadow 0.4s ease;
  }

  button.tab {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 18px;
    border: none;
    background: transparent;
    border-radius: 999px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink-dim);
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.3s ease;
  }
  button.tab[aria-selected="true"] { color: var(--ink); }

  button.tab .icon {
    display: flex;
    transition: transform 0.2s var(--ease-out);
  }
  button.tab:active .icon { transform: scale(0.88); }

  button.tab:focus-visible,
  .theme-toggle:focus-visible {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blob-b);
  }

  /* =========================================================
     DIVIDER + THEME TOGGLE
     ========================================================= */
  .divider {
    width: 1px;
    height: 22px;
    background: var(--divider);
    margin: 0 4px;
    z-index: 3;
    transition: background 0.5s ease;
  }

  .theme-toggle {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.3s ease, background 0.3s ease;
  }
  .theme-toggle:hover { color: var(--ink); }
  .theme-toggle:active .icon-stack { transform: scale(0.82); }

  .icon-stack {
    position: relative;
    width: 20px; height: 20px;
    transition: transform 0.2s var(--ease-out);
  }
  .icon-stack svg {
    position: absolute; inset: 0;
    stroke-width: 2.1;
    transition: transform 0.55s var(--ease-spring), opacity 0.35s ease;
  }
  .icon-sun  { opacity: 1; transform: rotate(0deg) scale(1); }
  .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.4); }
  [data-theme="dark"] .icon-sun  { opacity: 0; transform: rotate(90deg) scale(0.4); }
  [data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }

  /* =========================================================
     ACCESSIBILITY / MOTION
     ========================================================= */
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .active-pill, .icon-stack svg, button.tab, .icon { transition-duration: 0.01ms !important; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <div class="mesh" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <nav class="liquid-nav" id="nav" aria-label="Primary">
    <div class="liquid-glare-container" aria-hidden="true">
      <div class="liquid-glare" id="glare"></div>
    </div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <span class="active-pill" id="activePill"></span>

      <button class="tab" role="tab" aria-selected="true" tabindex="0" data-panel="home">
        <span class="icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 12 3l9 6.5"/>
            <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
          </svg>
        </span>
        <span>Home</span>
      </button>

      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-panel="search">
        <span class="icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </span>
        <span>Search</span>
      </button>

      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-panel="messages">
        <span class="icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </span>
        <span>Messages</span>
      </button>
    </div>

    <div class="divider" role="separator" aria-orientation="vertical"></div>

    <button class="theme-toggle" id="themeToggle" aria-pressed="false">
      <span class="icon-stack" aria-hidden="true">
        <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
        </svg>
        <svg class="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </span>
      <span class="sr-only">Toggle dark mode</span>
    </button>
  </nav>

<script>
(() => {
  const nav          = document.getElementById('nav');
  const tabsEl        = document.getElementById('tabs');
  const tabs          = Array.from(tabsEl.querySelectorAll('.tab'));
  const activePill    = document.getElementById('activePill');
  const glare          = document.getElementById('glare');
  const themeToggle    = document.getElementById('themeToggle');
  const reduceMotion  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- pill positioning ---------- */
  function movePill(btn, animate = true) {
    activePill.style.transition = animate
      ? 'transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1), width 0.5s cubic-bezier(0.34, 1.4, 0.64, 1)'
      : 'none';
    activePill.style.width = btn.offsetWidth + 'px';
    activePill.style.transform = `translateX(${btn.offsetLeft}px)`;
  }

  function selectTab(btn, { focus = false } = {}) {
    tabs.forEach(t => {
      t.setAttribute('aria-selected', 'false');
      t.tabIndex = -1;
    });
    btn.setAttribute('aria-selected', 'true');
    btn.tabIndex = 0;
    movePill(btn);
    if (focus) btn.focus();
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => selectTab(btn));
  });

  /* roving-tabindex keyboard support (arrow keys, home/end) */
  tabsEl.addEventListener('keydown', (e) => {
    const current = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
    let next = null;
    if (e.key === 'ArrowRight') next = (current + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') next = (current - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = tabs.length - 1;
    if (next !== null) {
      e.preventDefault();
      selectTab(tabs[next], { focus: true });
    }
  });

  /* keep pill aligned on load & resize */
  window.addEventListener('load', () => {
    const initial = tabs.find(t => t.getAttribute('aria-selected') === 'true');
    movePill(initial, false);
    void activePill.offsetWidth;
  });
  window.addEventListener('resize', () => {
    const current = tabs.find(t => t.getAttribute('aria-selected') === 'true');
    movePill(current, false);
  });

  /* ---------- interactive glare that follows the cursor across the glass ---------- */
  if (!reduceMotion) {
    nav.addEventListener('mousemove', (e) => {
      const rect = nav.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      glare.style.setProperty('--x', x + 'px');
      glare.style.setProperty('--y', y + 'px');
    });
  }

  /* ---------- theme toggle ---------- */
  const root = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (prefersDark) {
    root.setAttribute('data-theme', 'dark');
    themeToggle.setAttribute('aria-pressed', 'true');
  }

  themeToggle.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    themeToggle.setAttribute('aria-pressed', String(!isDark));
    setTimeout(() => {
      const current = tabs.find(t => t.getAttribute('aria-selected') === 'true');
      movePill(current, false);
    }, 50);
  });
})();
</script>
</body>
</html>
