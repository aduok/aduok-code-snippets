
<style>
  :root {
    --cube-size: 80px;
    --cube-half: 40px;
    --face-top: hsl(205, 20%, 22%);
    --face-grad-start: hsl(205, 18%, 22%);
    --face-grad-mid: hsl(200, 55%, 52%);
    --face-grad-end: hsl(198, 90%, 62%);
    --shadow-color: hsl(200, 60%, 48%);
    --shadow-dark: hsl(210, 15%, 20%);
  }

  .scene {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
  }

  .cube {
    position: relative;
    width: var(--cube-size);
    height: var(--cube-size);
    transform-style: preserve-3d;
    transform: rotateX(-30deg) rotateY(0deg);
    animation: spinCube 4s linear infinite;
  }

  @keyframes spinCube {
    from { transform: rotateX(-30deg) rotateY(0deg); }
    to   { transform: rotateX(-30deg) rotateY(360deg); }
  }

  .cube__faces {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  .cube__face {
    position: absolute;
    width: 100%;
    height: 100%;
    transform: rotateY(calc(90deg * var(--face-index))) translateZ(var(--cube-half));
    background: linear-gradient(
      to bottom,
      hsl(205, 18%, 22%)   0%,
      hsl(202, 28%, 35%)   8%,
      hsl(200, 42%, 44%)  18%,
      hsl(199, 55%, 52%)  30%,
      hsl(198, 65%, 57%)  43%,
      hsl(197, 74%, 60%)  55%,
      hsl(196, 82%, 62%)  67%,
      hsl(196, 88%, 63%)  78%,
      hsl(195, 93%, 64%)  88%,
      hsl(195, 97%, 65%) 100%
    );
  }

  .cube__top {
    position: absolute;
    width: var(--cube-size);
    height: var(--cube-size);
    background: var(--face-top);
    transform: rotateX(90deg) translateZ(var(--cube-half));
    transform-style: preserve-3d;
  }

  .cube__top::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--shadow-color);
    transform: translateZ(calc(var(--cube-size) * -1.125));
    filter: blur(12px);
    box-shadow:
      0 0 12px var(--shadow-dark),
      0 0 24px var(--shadow-color),
      0 0 36px var(--shadow-dark),
      0 0 48px var(--shadow-color);
    opacity: 0.7;
  }
</style>

<h2 class="sr-only">Animated 3D spinning cube loader in light blue</h2>

<div class="scene">
  <div class="cube" role="status" aria-label="Loading">
    <div class="cube__top"></div>
    <div class="cube__faces">
      <div class="cube__face" style="--face-index: 0"></div>
      <div class="cube__face" style="--face-index: 1"></div>
      <div class="cube__face" style="--face-index: 2"></div>
      <div class="cube__face" style="--face-index: 3"></div>
    </div>
  </div>
</div>
