<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metaball Glass Refraction</title>
<style>
  :root {
    --bg: #06060a;
    --ink: rgba(255, 255, 255, 0.32);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; }
  #stage { position: relative; width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }
  .hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font: 500 12px/1.4 'Space Grotesk', system-ui, sans-serif;
    letter-spacing: 0.06em;
    color: var(--ink);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="hint">drag to disturb the glass &middot; click to add droplets</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.1/build/three.module.js" } }
  </script>

  <script type="module">
  import * as THREE from "three";

  /* ============================================================
   * Metaball Glass Refraction — refracting typography via droplets
   *
   * Structure:
   *   Config        static tunables
   *   TypeLayer     paints the background text/gradient to a canvas texture
   *   DropletField  owns droplet state + physics (forces, merge, split)
   *   GlassMaterial builds the refraction shader + its data texture
   *   Pointer       normalizes mouse/touch input into sim-space coords
   *   App           wires everything together and runs the fixed-step loop
   * ============================================================ */

  const Config = Object.freeze({
    maxDroplets: 40,
    stepMs: 8,           // fixed physics timestep
    maxFrameMs: 100,      // clamp huge tab-switch deltas
    maxStepsPerFrame: 6,  // avoid spiral-of-death catch-up

    damping: 0.992,
    maxSpeed: 0.015,
    bounce: 0.42,

    wanderForce: 0.00004,
    centerPull: 0.000008,

    pointerRadius: 0.18,
    pointerForce: 0.004,

    tensionRange: 0.12,
    tensionForce: 0.00042,

    mergeRatio: 0.6,
    splitMinRadius: 0.045,
    splitSpeed: 0.014,

    trailStiffness: 0.22,
    trailDamping: 0.6,
    trailStretch: 3.2,
    trailScale: 0.68,

    seedCount: 12,
    ambientSpawnEvery: 2200,
    ambientSpawnCap: 10,
  });

  /* ---------------------------------------------------------- */
  /* TypeLayer                                                   */
  /* ---------------------------------------------------------- */
  class TypeLayer {
    constructor() {
      this.canvas = document.createElement("canvas");
      this.ctx = this.canvas.getContext("2d");
      this.texture = new THREE.CanvasTexture(this.canvas);
      this.texture.minFilter = THREE.LinearFilter;
      this.texture.magFilter = THREE.LinearFilter;
    }

    paint(pixelWidth, pixelHeight) {
      const { canvas, ctx } = this;
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;

      this.#paintGradientBase(pixelWidth, pixelHeight);
      this.#paintAmbientGlow(pixelWidth, pixelHeight);
      this.#paintVignette(pixelWidth, pixelHeight);
      this.#paintHeadline(pixelWidth, pixelHeight);

      this.texture.needsUpdate = true;
    }

    #paintGradientBase(w, h) {
      const g = this.ctx.createLinearGradient(0, 0, w * 0.35, h);
      g.addColorStop(0.0, "#ff8a5b");
      g.addColorStop(0.32, "#e14e8f");
      g.addColorStop(0.62, "#6a3cc9");
      g.addColorStop(1.0, "#1a1147");
      this.ctx.fillStyle = g;
      this.ctx.fillRect(0, 0, w, h);
    }

    #paintAmbientGlow(w, h) {
      const ctx = this.ctx;
      const blobs = [
        { x: 0.16, y: 0.22, hue: 26,  sat: 92, light: 68, alpha: 0.55 },
        { x: 0.82, y: 0.18, hue: 320, sat: 85, light: 62, alpha: 0.5 },
        { x: 0.72, y: 0.78, hue: 262, sat: 75, light: 46, alpha: 0.55 },
        { x: 0.2,  y: 0.82, hue: 200, sat: 80, light: 55, alpha: 0.4 },
      ];

      ctx.save();
      for (const b of blobs) {
        const rg = ctx.createRadialGradient(w * b.x, h * b.y, 0, w * b.x, h * b.y, w * 0.38);
        rg.addColorStop(0, `hsla(${b.hue}, ${b.sat}%, ${b.light}%, ${b.alpha})`);
        rg.addColorStop(1, `hsla(${b.hue}, ${b.sat}%, ${b.light}%, 0)`);
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, w, h);
      }
      ctx.restore();
    }

    #paintVignette(w, h) {
      const ctx = this.ctx;
      const rg = ctx.createRadialGradient(w * 0.5, h * 0.5, h * 0.25, w * 0.5, h * 0.5, w * 0.75);
      rg.addColorStop(0, "rgba(0, 0, 0, 0)");
      rg.addColorStop(1, "rgba(8, 4, 24, 0.45)");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, w, h);
    }

    #paintHeadline(w, h) {
      const ctx = this.ctx;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const lineSize = Math.round(w * 0.15);
      const y1 = h * 0.44;
      const y2 = y1 + lineSize * 1.02;

      ctx.font = `700 ${lineSize}px 'Space Grotesk', system-ui, sans-serif`;

      // soft glow pass beneath the crisp text for extra presence
      ctx.save();
      ctx.shadowColor = "rgba(255, 255, 255, 0.55)";
      ctx.shadowBlur = w * 0.02;
      ctx.fillStyle = "#ffffff";
      ctx.fillText("ADUOK", w * 0.5, y1);
      ctx.fillText("CODE", w * 0.5, y2);
      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.fillText("ADUOK", w * 0.5, y1);
      ctx.fillText("CODE", w * 0.5, y2);
    }
  }

  /* ---------------------------------------------------------- */
  /* Droplet — single soft-body blob                             */
  /* ---------------------------------------------------------- */
  class Droplet {
    static #nextId = 0;

    constructor(x, y, radius, vx = 0, vy = 0) {
      this.id = Droplet.#nextId++;
      this.x = x;
      this.y = y;
      this.radius = radius;
      this.area = Math.PI * radius * radius;

      if (vx || vy) {
        this.vx = vx;
        this.vy = vy;
      } else {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.0003 + Math.random() * 0.0008;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
      }

      this.alive = true;
      this.wanderAngle = Math.random() * Math.PI * 2;
      this.wanderRate = 0.3 + Math.random() * 0.5;

      // trailing soft-body offset, used to fake a stretchy tail
      this.trail = { prevX: x, prevY: y, offX: 0, offY: 0, velX: 0, velY: 0 };
    }

    setRadius(r) {
      this.radius = r;
      this.area = Math.PI * r * r;
    }

    speed() {
      return Math.hypot(this.vx, this.vy);
    }
  }

  /* ---------------------------------------------------------- */
  /* DropletField — physics simulation over a set of Droplets    */
  /* ---------------------------------------------------------- */
  class DropletField {
    constructor(cfg) {
      this.cfg = cfg;
      this.droplets = [];
      this.aspect = 1;
      this.ambientTimer = 0;
    }

    seed(count) {
      for (let i = 0; i < count; i++) {
        this.spawn(
          (Math.random() - 0.5) * 0.7,
          (Math.random() - 0.5) * 0.5,
          0.03 + Math.random() * 0.05,
        );
      }
    }

    spawn(x, y, radius, vx, vy) {
      if (this.droplets.length >= this.cfg.maxDroplets) return null;
      const d = new Droplet(x, y, radius, vx, vy);
      this.droplets.push(d);
      return d;
    }

    step(pointer) {
      this.#applyForces(pointer);
      this.#integrate();
      this.#merge();
      this.#split();
      this.#advanceTrails();
      this.#ambientSpawn();
    }

    #applyForces(pointer) {
      const { wanderForce, centerPull, pointerRadius, pointerForce } = this.cfg;

      for (const d of this.droplets) {
        d.wanderAngle += (Math.random() - 0.5) * d.wanderRate;
        d.vx += Math.cos(d.wanderAngle) * wanderForce;
        d.vy += Math.sin(d.wanderAngle) * wanderForce;

        d.vx -= d.x * centerPull;
        d.vy -= d.y * centerPull;

        if (pointer.active) {
          const dx = d.x - pointer.x;
          const dy = d.y - pointer.y;
          const distSq = dx * dx + dy * dy;
          const reach = pointerRadius + d.radius;
          if (distSq < reach * reach && distSq > 1e-6) {
            const dist = Math.sqrt(distSq);
            const falloff = 1 - dist / reach;
            const f = falloff * falloff * pointerForce;
            d.vx += (dx / dist) * f;
            d.vy += (dy / dist) * f;
          }
        }
      }

      this.#applySurfaceTension();
    }

    #applySurfaceTension() {
      const { tensionRange, tensionForce } = this.cfg;
      const list = this.droplets;
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        for (let j = i + 1; j < list.length; j++) {
          const b = list[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distSq = dx * dx + dy * dy;
          const reach = tensionRange + a.radius + b.radius;
          if (distSq >= reach * reach || distSq < 1e-6) continue;

          const dist = Math.sqrt(distSq);
          const f = (1 - dist / reach) * tensionForce;
          const fx = (dx / dist) * f;
          const fy = (dy / dist) * f;
          a.vx += fx; a.vy += fy;
          b.vx -= fx; b.vy -= fy;
        }
      }
    }

    #integrate() {
      const { maxSpeed, damping, bounce } = this.cfg;
      const halfW = this.aspect * 0.5;
      const halfH = 0.5;

      for (const d of this.droplets) {
        const speed = d.speed();
        if (speed > maxSpeed) {
          const s = maxSpeed / speed;
          d.vx *= s; d.vy *= s;
        }

        d.x += d.vx;
        d.y += d.vy;
        d.vx *= damping;
        d.vy *= damping;

        if (d.x - d.radius < -halfW) { d.x = -halfW + d.radius; d.vx = Math.abs(d.vx) * bounce; }
        if (d.x + d.radius > halfW)  { d.x = halfW - d.radius;  d.vx = -Math.abs(d.vx) * bounce; }
        if (d.y - d.radius < -halfH) { d.y = -halfH + d.radius; d.vy = Math.abs(d.vy) * bounce; }
        if (d.y + d.radius > halfH)  { d.y = halfH - d.radius;  d.vy = -Math.abs(d.vy) * bounce; }
      }
    }

    #merge() {
      const list = this.droplets;
      const ratio = this.cfg.mergeRatio;

      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        if (!a.alive) continue;
        for (let j = i + 1; j < list.length; j++) {
          const b = list[j];
          if (!b.alive) continue;

          const dist = Math.hypot(b.x - a.x, b.y - a.y);
          if (dist >= (a.radius + b.radius) * ratio) continue;

          const totalArea = a.area + b.area;
          a.x = (a.x * a.area + b.x * b.area) / totalArea;
          a.y = (a.y * a.area + b.y * b.area) / totalArea;
          a.vx = (a.vx * a.area + b.vx * b.area) / totalArea;
          a.vy = (a.vy * a.area + b.vy * b.area) / totalArea;
          a.setRadius(Math.sqrt(totalArea / Math.PI));
          b.alive = false;
        }
      }

      if (list.some((d) => !d.alive)) {
        this.droplets = list.filter((d) => d.alive);
      }
    }

    #split() {
      const { splitMinRadius, splitSpeed, maxDroplets } = this.cfg;
      const spawned = [];

      for (const d of this.droplets) {
        if (d.radius < splitMinRadius) continue;
        const speed = d.speed();
        if (speed < splitSpeed) continue;

        const halfArea = d.area * 0.5;
        const childRadius = Math.sqrt(halfArea / Math.PI);
        const nx = -d.vy / speed;
        const ny = d.vx / speed;
        const offset = childRadius * 0.7;

        d.setRadius(childRadius);
        d.x -= nx * offset;
        d.y -= ny * offset;

        const child = new Droplet(
          d.x + nx * offset * 2,
          d.y + ny * offset * 2,
          childRadius,
          d.vx + nx * speed * 0.35,
          d.vy + ny * speed * 0.35,
        );
        spawned.push(child);
      }

      for (const child of spawned) {
        if (this.droplets.length < maxDroplets) this.droplets.push(child);
      }
    }

    #advanceTrails() {
      const { trailStiffness, trailDamping } = this.cfg;
      for (const d of this.droplets) {
        const t = d.trail;
        const dx = d.x - t.prevX;
        const dy = d.y - t.prevY;

        t.velX = (t.velX + (dx - t.offX) * trailStiffness) * trailDamping;
        t.velY = (t.velY + (dy - t.offY) * trailStiffness) * trailDamping;
        t.offX += t.velX;
        t.offY += t.velY;

        t.prevX = d.x;
        t.prevY = d.y;
      }
    }

    #ambientSpawn() {
      this.ambientTimer += this.cfg.stepMs;
      if (this.ambientTimer < this.cfg.ambientSpawnEvery) return;
      if (this.droplets.length >= this.cfg.ambientSpawnCap) return;

      this.ambientTimer = 0;
      this.spawn(
        (Math.random() - 0.5) * this.aspect * 0.6,
        (Math.random() - 0.5) * 0.6,
        0.025 + Math.random() * 0.03,
      );
    }
  }

  /* ---------------------------------------------------------- */
  /* GlassMaterial — shader + the data texture that feeds it     */
  /* ---------------------------------------------------------- */
  class GlassMaterial {
    constructor(maxDroplets, typeTexture) {
      // main blob + a trailing "ghost" blob per droplet, packed side by side
      this.slotCount = maxDroplets * 2;
      this.buffer = new Float32Array(this.slotCount * 4);
      this.dataTexture = new THREE.DataTexture(
        this.buffer, this.slotCount, 1, THREE.RGBAFormat, THREE.FloatType,
      );
      this.dataTexture.minFilter = THREE.NearestFilter;
      this.dataTexture.magFilter = THREE.NearestFilter;

      this.material = new THREE.ShaderMaterial({
        vertexShader: GlassMaterial.VERTEX,
        fragmentShader: GlassMaterial.fragment(this.slotCount),
        uniforms: {
          uResolution: { value: new THREE.Vector2(1, 1) },
          uDroplets: { value: this.dataTexture },
          uScene: { value: typeTexture },
          uActiveCount: { value: 0 },
        },
      });
    }

    setResolution(w, h) {
      this.material.uniforms.uResolution.value.set(w, h);
    }

    /** Push droplet + trail-ghost positions into the GPU buffer. */
    sync(droplets) {
      this.buffer.fill(0);
      const n = Math.min(droplets.length, this.slotCount / 2);

      for (let i = 0; i < n; i++) {
        const d = droplets[i];

        const mi = i * 4;
        this.buffer[mi] = d.x;
        this.buffer[mi + 1] = d.y;
        this.buffer[mi + 2] = d.radius;
        this.buffer[mi + 3] = 1;

        const gi = (n + i) * 4;
        const stretch = this.constructor.TRAIL_STRETCH;
        this.buffer[gi] = d.x - d.trail.offX * stretch;
        this.buffer[gi + 1] = d.y - d.trail.offY * stretch;
        this.buffer[gi + 2] = d.radius * this.constructor.TRAIL_SCALE;
        this.buffer[gi + 3] = 1;
      }

      this.dataTexture.needsUpdate = true;
      this.material.uniforms.uActiveCount.value = n * 2;
    }

    static VERTEX = /* glsl */ `
      void main() {
        gl_Position = vec4(position, 1.0);
      }
    `;

    static fragment(slotCount) {
      return /* glsl */ `
        precision highp float;
        #define SLOT_COUNT ${slotCount}

        uniform vec2      uResolution;
        uniform sampler2D uDroplets;
        uniform sampler2D uScene;
        uniform int        uActiveCount;

        struct FieldSample {
          float value;
          vec2  gradient;
          vec2  pull;
          float pullWeight;
        };

        FieldSample sampleField(vec2 p) {
          FieldSample result;
          result.value = 0.0;
          result.gradient = vec2(0.0);
          result.pull = vec2(0.0);
          result.pullWeight = 0.0;

          for (int i = 0; i < SLOT_COUNT; i++) {
            if (i >= uActiveCount) break;

            vec4 blob = texture2D(uDroplets, vec2((float(i) + 0.5) / float(SLOT_COUNT), 0.5));
            vec2 center = blob.xy;
            float radius = blob.z;
            if (radius < 0.001) continue;

            vec2 delta = p - center;
            float distSq = dot(delta, delta) + 1e-5;
            float contribution = radius * radius / distSq;

            result.value += contribution;
            result.gradient += -2.0 * contribution / distSq * delta;

            float pullWeight = radius * radius / (distSq + radius * radius);
            result.pull += (center - p) * pullWeight;
            result.pullWeight += pullWeight;
          }

          return result;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uResolution;
          float aspect = uResolution.x / uResolution.y;
          vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

          FieldSample field = sampleField(p);

          const float threshold = 1.0;
          float edge = smoothstep(threshold - 0.08, threshold + 0.03, field.value);

          // Lens displacement: pull toward nearby blob centers, softly bounded.
          vec2 lens = field.pull / (field.pullWeight + 0.001);
          float lensLen = length(lens);
          vec2 lensDir = lensLen > 1e-5 ? lens / lensLen : vec2(0.0);
          float lensAmount = atan(lensLen * 6.0) * 0.035;
          float lensMask = smoothstep(threshold - 0.2, threshold + 1.5, field.value);
          vec2 refractedUV = clamp(uv + lensDir * lensAmount * lensMask, 0.001, 0.999);

          vec3 sceneColor = texture2D(uScene, uv).rgb;

          // Surface normal derived from the field gradient, compressed to avoid blow-ups.
          float gradLen = length(field.gradient);
          float normalStrength = atan(gradLen * 0.5) * 0.3;
          vec2 tilt = gradLen > 1e-4 ? (field.gradient / gradLen) * normalStrength : vec2(0.0);
          vec3 normal = normalize(vec3(-tilt, 1.0));

          vec3 lightDir = normalize(vec3(0.3, 0.6, 1.0));
          vec3 viewDir = vec3(0.0, 0.0, 1.0);
          vec3 halfDir = normalize(lightDir + viewDir);

          float diffuse = max(dot(normal, lightDir), 0.0);
          float specular = pow(max(dot(normal, halfDir), 0.0), 180.0);
          float fresnel = 0.04 + 0.96 * pow(1.0 - max(dot(normal, viewDir), 0.0), 4.0);
          float rim = smoothstep(threshold + 0.6, threshold, field.value) * edge;

          // Mild chromatic aberration along the lens direction.
          float aberration = 0.0018 * edge;
          vec3 refracted;
          refracted.r = texture2D(uScene, refractedUV + lensDir * aberration).r;
          refracted.g = texture2D(uScene, refractedUV).g;
          refracted.b = texture2D(uScene, refractedUV - lensDir * aberration).b;

          float depth = smoothstep(threshold, threshold + 3.0, field.value);
          vec3 depthTint = mix(vec3(1.0), vec3(0.93, 0.96, 1.0), depth * 0.45);

          vec3 glass = refracted * depthTint * (0.92 + 0.08 * diffuse)
                     + vec3(1.0) * specular * 0.85
                     + vec3(0.9, 0.95, 1.0) * rim * 0.22
                     + vec3(1.0) * fresnel * 0.10;

          float shadow = smoothstep(threshold - 0.35, threshold - 0.05, field.value);
          vec3 background = sceneColor * (1.0 - shadow * 0.06);

          float borderOuter = smoothstep(threshold - 0.10, threshold - 0.01, field.value);
          float borderInner = smoothstep(threshold, threshold + 0.06, field.value);
          float border = borderOuter * (1.0 - borderInner) * 0.28;

          vec3 color = mix(background, glass, edge) + vec3(1.0) * border;
          gl_FragColor = vec4(color, 1.0);
        }
      `;
    }
  }
  GlassMaterial.TRAIL_STRETCH = Config.trailStretch;
  GlassMaterial.TRAIL_SCALE = Config.trailScale;

  /* ---------------------------------------------------------- */
  /* Pointer — normalizes mouse/touch into simulation space       */
  /* ---------------------------------------------------------- */
  class Pointer {
    constructor(domElement, getAspect) {
      this.x = 999;
      this.y = 999;
      this.active = false;
      this.down = false;
      this.getAspect = getAspect;

      domElement.addEventListener("pointermove", (e) => this.#onMove(e, domElement));
      domElement.addEventListener("pointerdown", () => { this.down = true; });
      domElement.addEventListener("pointerup", () => { this.down = false; });
      domElement.addEventListener("pointerleave", () => {
        this.active = false;
        this.down = false;
      });
    }

    #onMove(e, domElement) {
      const rect = domElement.getBoundingClientRect();
      this.x = ((e.clientX - rect.left) / rect.width - 0.5) * this.getAspect();
      this.y = 0.5 - (e.clientY - rect.top) / rect.height;
      this.active = true;
    }
  }

  /* ---------------------------------------------------------- */
  /* App — wiring, resize handling, and the render loop           */
  /* ---------------------------------------------------------- */
  class App {
    constructor(container) {
      this.renderer = new THREE.WebGLRenderer({ antialias: false });
      this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(this.renderer.domElement);

      this.scene = new THREE.Scene();
      this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      this.typeLayer = new TypeLayer();
      this.field = new DropletField(Config);
      this.glass = new GlassMaterial(Config.maxDroplets, this.typeLayer.texture);
      this.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.glass.material));

      this.pointer = new Pointer(this.renderer.domElement, () => this.field.aspect);

      this.spawnCooldown = 0;
      this.lastFrameTime = performance.now();
      this.accumulatedMs = 0;
      this.paused = false;

      this.#handleResize();
      window.addEventListener("resize", () => this.#handleResize());
      document.addEventListener("visibilitychange", () => {
        this.paused = document.hidden;
        if (!this.paused) this.lastFrameTime = performance.now();
      });

      document.fonts.ready.then(() => this.#repaintScene());
      this.field.seed(Config.seedCount);
    }

    #handleResize() {
      this.renderer.setSize(window.innerWidth, window.innerHeight);
      this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      this.field.aspect = window.innerWidth / window.innerHeight;
      this.glass.setResolution(this.renderer.domElement.width, this.renderer.domElement.height);
      this.#repaintScene();
    }

    #repaintScene() {
      this.typeLayer.paint(this.renderer.domElement.width, this.renderer.domElement.height);
    }

    #handlePointerSpawn() {
      if (!this.pointer.down || !this.pointer.active) return;
      this.spawnCooldown -= Config.stepMs;
      if (this.spawnCooldown > 0) return;

      this.spawnCooldown = 120;
      this.field.spawn(
        this.pointer.x + (Math.random() - 0.5) * 0.02,
        this.pointer.y + (Math.random() - 0.5) * 0.02,
        0.02 + Math.random() * 0.015,
      );
    }

    #fixedUpdate() {
      this.field.step(this.pointer);
      this.#handlePointerSpawn();
    }

    start() {
      const loop = () => {
        if (this.paused) {
          requestAnimationFrame(loop);
          return;
        }

        const now = performance.now();
        const dt = Math.min(now - this.lastFrameTime, Config.maxFrameMs);
        this.lastFrameTime = now;
        this.accumulatedMs += dt;

        let steps = 0;
        while (this.accumulatedMs >= Config.stepMs && steps < Config.maxStepsPerFrame) {
          this.#fixedUpdate();
          this.accumulatedMs -= Config.stepMs;
          steps++;
        }
        if (steps >= Config.maxStepsPerFrame) this.accumulatedMs = 0;

        this.glass.sync(this.field.droplets);
        this.renderer.render(this.scene, this.camera);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }
  }

  new App(document.getElementById("stage")).start();
  </script>
</body>
