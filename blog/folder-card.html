<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Folder Card</title>
<style>
  /* ==================================================================
     THE DOSSIER
     A leather-bound document case: deep emerald cover, a foil-stamped
     title plate, and a ribbon bookmark. Click it and the cover swings
     open on its ribbon, releasing an index of pages.
     ================================================================== */

  * { box-sizing: border-box; }

  .dossier {
    --leather-950: #0a2a20;
    --leather-800: #123f2f;
    --leather-650: #1c5843;
    --foil-300:    #f2dfa8;
    --foil-500:    #d1a75a;
    --foil-700:    #9c793a;
    --page-050:    #f6efdf;
    --page-150:    #ece0c4;
    --ink-900:     #22281f;
    --ink-500:     #6b6250;
    --shadow-soft: rgba(9, 20, 15, 0.45);
    --ease-swing:  cubic-bezier(0.22, 1, 0.36, 1);
    --ease-pop:    cubic-bezier(0.34, 1.56, 0.64, 1);

    position: relative;
    display: inline-flex;
    width: clamp(170px, 42vw, 195px);
    aspect-ratio: 195 / 150;
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .dossier__toggle {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    border: 0;
  }

  .dossier__toggle:focus-visible ~ .dossier__stage {
    outline: 2px solid var(--foil-300);
    outline-offset: 5px;
    border-radius: 10px;
  }

  .dossier__stage {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;

    /* the counter must be reset on an ancestor that comes BEFORE the
       pages in document order — it was on the badge itself, which sits
       earlier in the markup than the <ul> of pages, so it always read 0 */
    counter-reset: page-count 0;
  }

  /* ---------------------------- hint ---------------------------- */

  .dossier__hint {
    position: absolute;
    top: -26px;
    left: 2px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--foil-300);
    font-family: "Iowan Old Style", Georgia, serif;
    font-style: italic;
    transition: opacity 0.25s ease;
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__hint {
    opacity: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .dossier__hint { animation: drift 2.4s ease-in-out infinite; }
  }
  @keyframes drift {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(3px); }
  }

  /* ---------------------------- back panel ---------------------------- */

  .dossier__back {
    position: absolute;
    inset: 14% 0 0 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(155deg, var(--leather-800), var(--leather-950));
    border-radius: 6px 12px 8px 8px;
    box-shadow: 0 14px 26px var(--shadow-soft);
  }

  /* ---------------------------- pages ---------------------------- */

  .dossier__pages {
    position: absolute;
    inset: auto 8% 6px 8%;
    height: 78%;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .dossier__page {
    --i: 0;
    --tilt: 0deg;
    --shift: 0px;

    position: absolute;
    inset: 0;
    z-index: calc(20 - var(--i));
    background: linear-gradient(175deg, var(--page-050), var(--page-150));
    border: 1px solid rgba(34, 40, 31, 0.12);
    border-radius: 3px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 5px 10px rgba(9, 20, 15, 0.3);
    transition: transform 0.6s var(--ease-swing);
    transition-delay: calc((4 - var(--i)) * 0.04s);
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__page {
    transform:
      translate(var(--shift), calc(-14px - var(--i) * 15px))
      rotate(var(--tilt));
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__page:hover {
    filter: brightness(1.03);
    transform:
      translate(var(--shift), calc(-22px - var(--i) * 15px))
      rotate(var(--tilt));
  }

  .dossier__page-index {
    align-self: flex-start;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--leather-650);
    color: var(--page-050);
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 9px;
    font-weight: 700;
  }

  .dossier__page-icon {
    width: 15px;
    height: 15px;
    color: var(--ink-500);
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 0.3s ease 0.3s, transform 0.3s ease 0.3s;
  }

  .dossier__page-name {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--ink-900);
    line-height: 1.3;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 0.3s ease 0.35s, transform 0.3s ease 0.35s;
  }

  .dossier__page-meta {
    font-family: "Courier New", monospace;
    font-size: 6.8px;
    letter-spacing: 0.03em;
    color: var(--ink-500);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s ease 0.4s;
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__page-icon,
  .dossier__toggle:checked ~ .dossier__stage .dossier__page-name,
  .dossier__toggle:checked ~ .dossier__stage .dossier__page-meta {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------------------------- cover ---------------------------- */

  .dossier__cover {
    position: absolute;
    inset: 0 0 8% 0;
    z-index: 30;
    border-radius: 6px 12px 10px 10px;
    background:
      linear-gradient(100deg, rgba(255,255,255,0.06) 0%, transparent 30%),
      linear-gradient(160deg, var(--leather-650), var(--leather-950) 85%);
    box-shadow:
      0 16px 28px var(--shadow-soft),
      inset 0 0 0 1px rgba(242, 223, 168, 0.08);
    transform-origin: left center;
    transition: transform 0.65s var(--ease-swing);
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__cover {
    transform: rotateY(-115deg);
  }

  /* stitched border, purely decorative */
  .dossier__cover::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px dashed rgba(242, 223, 168, 0.22);
    border-radius: 4px;
    pointer-events: none;
  }

  .dossier__plate {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 68%;
    padding: 7px 4px;
    text-align: center;
    border-top: 1px solid var(--foil-500);
    border-bottom: 1px solid var(--foil-500);
  }

  .dossier__plate-title {
    display: block;
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    background: linear-gradient(180deg, var(--foil-300), var(--foil-700));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .dossier__plate-sub {
    display: block;
    margin-top: 2px;
    font-family: "Courier New", monospace;
    font-size: 6px;
    letter-spacing: 0.14em;
    color: var(--foil-500);
    opacity: 0.85;
  }

  /* ribbon bookmark, wraps the spine edge */
  .dossier__ribbon {
    position: absolute;
    top: -6px;
    right: 22%;
    width: 12px;
    height: 46px;
    background: linear-gradient(180deg, var(--foil-300), var(--foil-700));
    clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
    box-shadow: 0 3px 6px rgba(9, 20, 15, 0.35);
    transform-origin: top center;
    transition: transform 0.55s var(--ease-swing), opacity 0.4s ease;
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__ribbon {
    transform: rotate(28deg) translateY(-6px);
    opacity: 0.65;
  }

  /* ---------------------------- badge ---------------------------- */

  .dossier__badge {
    position: absolute;
    top: -30px;
    right: -6px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    background: var(--leather-950);
    border: 1px solid var(--foil-500);
    border-radius: 20px;
    box-shadow: 0 8px 16px var(--shadow-soft);
    font-family: "Courier New", monospace;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--foil-300);
    transform: scale(0) translateY(10px);
    opacity: 0;
    transition: transform 0.45s var(--ease-pop) 0.15s, opacity 0.3s ease 0.15s;
  }

  .dossier__pages .dossier__page {
    counter-increment: page-count 1;
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__badge {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .dossier__badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #7bc99a;
    flex-shrink: 0;
  }

  .dossier__badge-count::after {
    content: counter(page-count);
  }

  /* ---------------------------- filter field ---------------------------- */

  .dossier__filter {
    position: absolute;
    top: -30px;
    left: 6px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 6px;
    width: 30px;
    height: 22px;
    padding: 0 8px;
    background: var(--leather-950);
    border: 1px solid var(--foil-500);
    border-radius: 20px;
    opacity: 0;
    transition: width 0.45s var(--ease-swing), opacity 0.35s ease;
  }

  .dossier__toggle:checked ~ .dossier__stage .dossier__filter {
    width: 62%;
    opacity: 1;
    transition-delay: 0.25s;
  }

  .dossier__filter-icon {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
    color: var(--foil-300);
  }

  .dossier__filter-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--page-050);
    font-family: "Courier New", monospace;
    font-size: 8px;
    letter-spacing: 0.02em;
  }

  .dossier__filter-input::placeholder {
    color: rgba(246, 239, 223, 0.5);
  }

  .dossier__page.is-filtered {
    opacity: 0 !important;
    pointer-events: none;
  }
  /* the one !important here overrides the fanned-open transform's opacity
     baseline (which is always 1); it's resolving a genuine state conflict,
     not patching a specificity mistake */

  /* ---------------------------- reduced motion ---------------------------- */

  @media (prefers-reduced-motion: reduce) {
    .dossier__cover,
    .dossier__page,
    .dossier__ribbon,
    .dossier__badge,
    .dossier__filter,
    .dossier__page-icon,
    .dossier__page-name,
    .dossier__page-meta,
    .dossier__hint {
      transition-duration: 0.01ms !important;
      animation: none !important;
    }
  }
</style>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#08120e; padding:70px;">

  <label class="dossier">
    <input type="checkbox" class="dossier__toggle" aria-label="Open the folder" />

    <div class="dossier__stage">

      <div class="dossier__hint" aria-hidden="true">open the folder →</div>

      <div class="dossier__back" aria-hidden="true"></div>

      <!-- the pages come before the badge in the MARKUP (though CSS positions
           the badge visually above the cover) so that by the time the badge's
           counter() is evaluated, every .dossier__page below has already
           incremented page-count -->
      <ul class="dossier__pages" aria-label="Files in this folder">

        <li class="dossier__page" style="--i:0; --shift:-14px; --tilt:-8deg;">
          <span class="dossier__page-index" aria-hidden="true">1</span>
          <svg class="dossier__page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <div>
            <div class="dossier__page-name">Site Survey Report</div>
            <div class="dossier__page-meta">Doc · 14 pgs</div>
          </div>
        </li>

        <li class="dossier__page" style="--i:1; --shift:16px; --tilt:6deg;">
          <span class="dossier__page-index" aria-hidden="true">2</span>
          <svg class="dossier__page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
          <div>
            <div class="dossier__page-name">Signed Agreement</div>
            <div class="dossier__page-meta">Pdf · Notarized</div>
          </div>
        </li>

        <li class="dossier__page" style="--i:2; --shift:-6px; --tilt:-12deg;">
          <span class="dossier__page-index" aria-hidden="true">3</span>
          <svg class="dossier__page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <div>
            <div class="dossier__page-name">Reference Photograph</div>
            <div class="dossier__page-meta">Jpg · Exhibit C</div>
          </div>
        </li>

        <li class="dossier__page" style="--i:3; --shift:10px; --tilt:10deg;">
          <span class="dossier__page-index" aria-hidden="true">4</span>
          <svg class="dossier__page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          <div>
            <div class="dossier__page-name">Recorded Statement</div>
            <div class="dossier__page-meta">Wav · 04:12</div>
          </div>
        </li>

        <li class="dossier__page" style="--i:4; --shift:0px; --tilt:-4deg;">
          <span class="dossier__page-index" aria-hidden="true">5</span>
          <svg class="dossier__page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polygon points="12 2 15 8.5 22 9.3 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.3 9 8.5"></polygon>
          </svg>
          <div>
            <div class="dossier__page-name">Design Proof, Final</div>
            <div class="dossier__page-meta">Svg · Approved</div>
          </div>
        </li>

      </ul>

      <div class="dossier__badge" title="Count is read from the file list, not typed by hand">
        <span class="dossier__badge-dot" aria-hidden="true"></span>
        <span class="dossier__badge-count"></span>&nbsp;FILES
      </div>

      <div class="dossier__filter">
        <svg class="dossier__filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="dossier__filter-input" placeholder="Search files…" aria-label="Filter files by name" />
      </div>

      <div class="dossier__cover">
        <div class="dossier__plate">
          <span class="dossier__plate-title">Folder</span>
          <span class="dossier__plate-sub">Project Files</span>
        </div>
        <div class="dossier__ribbon" aria-hidden="true"></div>
      </div>

    </div>
  </label>

  <script>
    // Progressive enhancement only — the cover still opens with zero JS
    // via the checkbox above. This just filters the visible pages.
    (function () {
      var input = document.querySelector(".dossier__filter-input");
      var pages = document.querySelectorAll(".dossier__page");
      if (!input) return;

      input.addEventListener("click", function (e) { e.stopPropagation(); });

      input.addEventListener("input", function () {
        var query = input.value.trim().toLowerCase();
        pages.forEach(function (page) {
          var name = page.querySelector(".dossier__page-name").textContent.toLowerCase();
          page.classList.toggle("is-filtered", query.length > 0 && !name.includes(query));
        });
      });
    })();
  </script>

</body>
</html>
