<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Card Carousel</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      display: grid;
    }

    body {
      min-height: 100vh;
      place-items: center;
      background: #1a0a2e;
      overflow: hidden;
    }

    /* ── Scene: sets up the 3D perspective + lateral fade mask ── */
    .scene {
      width: 100%;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 40em;
      mask: linear-gradient(90deg, transparent, crimson 18% 82%, transparent);
      -webkit-mask: linear-gradient(90deg, transparent, crimson 18% 82%, transparent);
    }

    /* ── Carousel ring: rotates continuously on the Y axis ── */
    .carousel {
      display: grid;
      place-self: center;
      transform-style: preserve-3d;
      animation: spin 36s linear infinite;
    }

    @keyframes spin {
      to { rotate: y 1turn; }
    }

    /* ── Individual cards stacked in a polygon ring ── */
    .card {
      /* Base card width — adjust to taste */
      --w: 16em;
      /* Total number of cards */
      --count: 12;
      /* Angular slice each card occupies */
      --angle: calc(1turn / var(--count));

      /* Stack all cards in the same grid cell */
      grid-area: 1 / 1;

      width: var(--w);
      aspect-ratio: 2 / 3;
      border-radius: 1.2em;
      object-fit: cover;

      /* Hide the back face so rear cards don't bleed through */
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      /*
       * Transform chain — ORDER MATTERS:
       * 1. Rotate around Y to reach this card's angular position
       * 2. Translate along −Z to push it outward onto the polygon
       *
       * The radius formula places cards on a regular polygon:
       *   r = (w/2 + gap) / tan(half-angle)
       */
      transform:
        rotateY(calc(var(--idx) * var(--angle)))
        translateZ(calc(-1 * (0.5 * var(--w) + 0.5em) / tan(0.5 * var(--angle))));

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Honour reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .carousel { animation-duration: 144s; }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="carousel">
      <img class="card" style="--idx: 0"  src="https://images.unsplash.com/photo-1682686580391-615b1f28e5ee?w=280" alt="nature landscape" />
      <img class="card" style="--idx: 1"  src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=280" alt="golden light" />
      <img class="card" style="--idx: 2"  src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=280" alt="mountain peaks" />
      <img class="card" style="--idx: 3"  src="https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=280" alt="forest path" />
      <img class="card" style="--idx: 4"  src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c?w=280" alt="misty lake" />
      <img class="card" style="--idx: 5"  src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=280" alt="aerial coast" />
      <img class="card" style="--idx: 6"  src="https://images.unsplash.com/photo-1540206395-68808572332f?w=280" alt="desert dunes" />
      <img class="card" style="--idx: 7"  src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=280" alt="snowy forest" />
      <img class="card" style="--idx: 8"  src="https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?w=280" alt="tropical beach" />
      <img class="card" style="--idx: 9"  src="https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=280" alt="canyon walls" />
      <img class="card" style="--idx: 10" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=280" alt="rocky cliffs" />
      <img class="card" style="--idx: 11" src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=280" alt="city skyline" />
    </div>
  </div>

</body>
</html>
