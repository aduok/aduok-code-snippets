<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Reveal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  .scene { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: none; }

  canvas { position: absolute; inset: 0; display: block; }

  .hint {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font: 500 11px/1 system-ui, sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.8s;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 0.95; }
  }
</style>
</head>
<body>
<div class="scene">
  <canvas id="c"></canvas>
  <p class="hint" id="hint">move to reveal</p>
</div>

<script>
  /* ============================================================
     IMAGES — place your files in the same folder as this HTML
     Change these two paths to match your filenames
  ============================================================ */
  const BG_IMAGE = 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=80';
  const FG_IMAGE = 'https://images.unsplash.com/photo-1476820865390-c52aeebb9891?w=1600&q=80';
  /* ============================================================ */

  const RADIUS    = 130;   // lens hard radius  (px)
  const BLUR_BAND = 60;    // feather width     (px)

  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const hint   = document.getElementById('hint');

  let W, H, mx = -9999, my = -9999, moved = false;
  let imgBg, imgFg;

  function loadImg(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload  = () => res(img);
      img.onerror = () => rej(new Error(`Could not load: ${src}`));
      img.src = src;
    });
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);

  function drawCover(context, img, w, h) {
    const scale = Math.max(w / img.width, h / img.height);
    const sw = img.width * scale, sh = img.height * scale;
    context.drawImage(img, (w - sw) / 2, (h - sh) / 2, sw, sh);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    /* 1 — Background (revealed through lens) */
    ctx.globalCompositeOperation = 'source-over';
    drawCover(ctx, imgBg, W, H);

    /* 2 — Foreground on offscreen, then punch a soft hole */
    const off = new OffscreenCanvas(W, H);
    const oc  = off.getContext('2d');
    drawCover(oc, imgFg, W, H);

    oc.globalCompositeOperation = 'destination-out';

    /* solid inner circle */
    oc.fillStyle = 'rgba(0,0,0,1)';
    oc.beginPath();
    oc.arc(mx, my, RADIUS, 0, Math.PI * 2);
    oc.fill();

    /* feathered outer ring */
    const grad = oc.createRadialGradient(mx, my, RADIUS, mx, my, RADIUS + BLUR_BAND);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    oc.fillStyle = grad;
    oc.beginPath();
    oc.arc(mx, my, RADIUS + BLUR_BAND, 0, Math.PI * 2);
    oc.fill();

    /* 3 — Composite masked fg over bg */
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(off, 0, 0);

    /* 4 — Vignette */
    const vig = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  function loop() { draw(); requestAnimationFrame(loop); }

  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    if (!moved) { moved = true; hint.style.opacity = '0'; }
  });
  document.addEventListener('mouseleave', () => { mx = -9999; my = -9999; });

  /* Load & start */
  Promise.all([loadImg(BG_IMAGE), loadImg(FG_IMAGE)])
    .then(([bg, fg]) => { imgBg = bg; imgFg = fg; resize(); loop(); })
    .catch(err => {
      document.body.innerHTML = `<p style="color:#f66;font:14px system-ui;padding:40px">
        ⚠️ ${err.message}<br><br>
        Make sure <b>1.png</b> and <b>2.png</b> are in the same folder as this HTML file,
        then open the file through a local server or Firefox (which allows relative paths).
      </p>`;
    });
</script>
</body>
</html>
