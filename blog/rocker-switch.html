
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocker Switch</title>
  <style>
    :root {
      --primary-hue: 223;
      --secondary-hue: 133;
      --surface: hsl(var(--primary-hue), 10%, 90%);
      --surface-dark: hsl(var(--primary-hue), 10%, 30%);
      --shadow-color: hsl(var(--primary-hue), 10%, 10%);
      --accent-strong: hsl(var(--secondary-hue), 90%, 45%);
      --transition-duration: 0.3s;
      --transition-ease: cubic-bezier(0.83, 0, 0.17, 1);
      font-family: sans-serif;
      font-size: calc(16px + (24 - 16) * (100vw - 320px) / (2560 - 320));
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: var(--surface);
      color: hsl(var(--primary-hue), 10%, 10%);
      font: 1em/1.5 sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .toggle-wrapper {
      min-height: 340px;
      width: 100%;
      display: grid;
      place-items: center;
      transition: background-color var(--transition-duration) var(--transition-ease),
                  color var(--transition-duration) var(--transition-ease);
    }

    .toggle {
      position: relative;
      width: 3.75em;
      height: 8.75em;
      background: var(--surface);
      border-radius: 0.375em;
      box-shadow:
        0 4.375em 2em hsl(var(--primary-hue), 10%, 70%) inset,
        0 0.125em 0 var(--surface) inset,
        0 0 0.375em hsla(var(--primary-hue), 10%, 10%, 0.5);
      transition: background var(--transition-duration) var(--transition-ease),
                  box-shadow var(--transition-duration) var(--transition-ease);
    }

    .toggle__input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle__input:focus-visible + .toggle__shadow,
    .toggle__input:focus-visible + .toggle__shadow + .toggle__knob {
      outline: 2px solid hsl(var(--primary-hue), 90%, 45%);
      outline-offset: 0.35em;
    }

    .toggle__knob,
    .toggle__shadow {
      pointer-events: none;
      display: block;
    }

    .toggle__knob {
      position: relative;
      margin: 0.375em;
      width: calc(100% - 0.75em);
      height: calc(100% - 0.75em);
      background: hsla(var(--primary-hue), 10%, 80%, 1);
      border-radius: 0.25em;
      box-shadow:
        0 0 0.25em var(--shadow-color) inset,
        0.75em 0 0.5em hsl(var(--primary-hue), 10%, 90%) inset;
      transition: background var(--transition-duration) var(--transition-ease),
                  box-shadow var(--transition-duration) var(--transition-ease);
    }

    .toggle__knob::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(hsla(var(--primary-hue), 10%, 10%, 0), hsla(var(--primary-hue), 10%, 10%, 0.2));
      border-radius: inherit;
    }

    .toggle__face {
      position: absolute;
      left: 0.125em;
      display: flex;
      justify-content: center;
      width: calc(100% - 0.25em);
      padding: 0.5em;
      height: calc(50% - 0.125em);
      transition: background var(--transition-duration) var(--transition-ease),
                  transform var(--transition-duration) var(--transition-ease);
    }

    .toggle__face--top {
      bottom: 50%;
      background: hsl(var(--primary-hue), 10%, 85%);
      border-radius: 0.25em 0.25em 0 0;
      transform-origin: 50% 100%;
    }

    .toggle__face--bottom {
      top: 50%;
      align-items: flex-end;
      background: hsl(var(--primary-hue), 10%, 90%);
      border-radius: 0 0 0.25em 0.25em;
      transform-origin: 50% 0;
      transform: rotateX(-35deg);
    }

    .toggle__indicator {
      content: "";
      display: block;
      transition: background var(--transition-duration) var(--transition-ease),
                  box-shadow var(--transition-duration) var(--transition-ease);
    }

    .toggle__face--top .toggle__indicator {
      width: 1em;
      height: 1em;
      border-radius: 50%;
      box-shadow:
        0 0 0 0.125em hsl(var(--primary-hue), 10%, 65%) inset,
        0 0.25em 0 hsl(var(--primary-hue), 10%, 90%) inset,
        0 0.125em 0 hsl(var(--primary-hue), 10%, 90%);
    }

    .toggle__face--bottom .toggle__indicator {
      width: 0.25em;
      height: 1.125em;
      background: hsl(var(--secondary-hue), 10%, 45%);
      box-shadow:
        0 0.125em 0 hsl(var(--secondary-hue), 10%, 30%) inset,
        0 -0.0625em 0 hsl(var(--primary-hue), 10%, 90%) inset,
        0 0 0.5em hsla(var(--secondary-hue), 90%, 45%, 0);
    }

    .toggle__shadow {
      position: absolute;
      top: 0.5em;
      right: 0;
      width: 5em;
      height: calc(100% - 0.25em);
      border-radius: 0.25em;
      overflow: hidden;
    }

    .toggle__shadow::before,
    .toggle__shadow::after {
      content: "";
      position: absolute;
      left: 1.625em;
      width: 3em;
      height: 50%;
      background: hsla(var(--primary-hue), 10%, 10%, 0.15);
      transition: background var(--transition-duration) var(--transition-ease),
                  transform var(--transition-duration) var(--transition-ease);
    }

    .toggle__shadow::before {
      top: 0;
      border-radius: 1.5em 0 0 0 / 1em 0 0 0;
      transform-origin: 0 100%;
    }

    .toggle__shadow::after {
      bottom: 0;
      border-radius: 0.25em;
      transform-origin: 0 0;
      transform: skewX(-10deg);
    }

    .toggle__input:checked ~ .toggle__knob .toggle__face--top {
      background: hsl(var(--primary-hue), 10%, 70%);
      transform: rotateX(35deg);
    }

    .toggle__input:checked ~ .toggle__knob .toggle__face--top .toggle__indicator {
      box-shadow:
        0 0 0 0.125em hsl(var(--primary-hue), 10%, 55%) inset,
        0 0.25em 0 hsl(var(--primary-hue), 10%, 80%) inset,
        0 0.125em 0 hsl(var(--primary-hue), 10%, 80%);
    }

    .toggle__input:checked ~ .toggle__knob .toggle__face--bottom {
      background: hsl(var(--primary-hue), 10%, 85%);
      transform: rotateX(0);
    }

    .toggle__input:checked ~ .toggle__knob .toggle__face--bottom .toggle__indicator {
      background: var(--accent-strong);
      box-shadow:
        0 0.125em 0 hsl(var(--secondary-hue), 90%, 30%) inset,
        0 -0.0625em 0 hsl(var(--primary-hue), 10%, 90%) inset,
        0 0 0.5em hsla(var(--secondary-hue), 90%, 45%, 1);
    }

    .toggle__input:checked ~ .toggle__shadow::before {
      transform: rotate(-10deg);
    }

    .toggle__input:checked ~ .toggle__shadow::after {
      transform: skewX(0) scaleY(0.85);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: var(--surface-dark);
      }

      body {
        color: hsl(var(--primary-hue), 10%, 90%);
      }

      .toggle {
        background: hsl(var(--primary-hue), 10%, 40%);
        box-shadow:
          0 4.375em 2em hsl(var(--primary-hue), 10%, 30%) inset,
          0 0.125em 0 hsl(var(--primary-hue), 10%, 40%) inset,
          0 0 0.375em hsla(var(--primary-hue), 10%, 10%, 0.5);
      }

      .toggle__knob {
        background: hsla(var(--primary-hue), 10%, 30%, 1);
      }

      .toggle__face--top {
        background: hsl(var(--primary-hue), 10%, 35%);
      }

      .toggle__face--top .toggle__indicator {
        box-shadow:
          0 0 0 0.125em hsl(var(--primary-hue), 10%, 25%) inset,
          0 0.25em 0 hsl(var(--primary-hue), 10%, 40%) inset,
          0 0.125em 0 hsl(var(--primary-hue), 10%, 40%);
      }

      .toggle__face--bottom {
        background: hsl(var(--primary-hue), 10%, 40%);
      }

      .toggle__face--bottom .toggle__indicator {
        background: hsl(var(--secondary-hue), 10%, 25%);
        box-shadow:
          0 0.125em 0 hsl(var(--secondary-hue), 10%, 20%) inset,
          0 -0.0625em 0 hsl(var(--primary-hue), 10%, 40%) inset,
          0 0 0.5em hsla(var(--secondary-hue), 90%, 45%, 0);
      }

      .toggle__shadow::before,
      .toggle__shadow::after {
        background: hsla(var(--primary-hue), 10%, 10%, 0.25);
      }

      .toggle__input:checked ~ .toggle__knob .toggle__face--top {
        background: hsl(var(--primary-hue), 10%, 25%);
      }

      .toggle__input:checked ~ .toggle__knob .toggle__face--top .toggle__indicator {
        box-shadow:
          0 0 0 0.125em hsl(var(--primary-hue), 10%, 15%) inset,
          0 0.25em 0 hsl(var(--primary-hue), 10%, 30%) inset,
          0 0.125em 0 hsl(var(--primary-hue), 10%, 30%);
      }

      .toggle__input:checked ~ .toggle__knob .toggle__face--bottom {
        background: hsl(var(--primary-hue), 10%, 35%);
      }

      .toggle__input:checked ~ .toggle__knob .toggle__face--bottom .toggle__indicator {
        background: var(--accent-strong);
        box-shadow:
          0 0.125em 0 hsl(var(--secondary-hue), 90%, 20%) inset,
          0 -0.0625em 0 hsl(var(--primary-hue), 10%, 40%) inset,
          0 0 0.5em hsla(var(--secondary-hue), 90%, 45%, 1);
      }
    }
  </style>
</head>
<body>
  <div class="toggle-wrapper">
    <label class="toggle">
      <input class="toggle__input" type="checkbox" role="switch" name="power" aria-label="Power">
      <span class="toggle__shadow"></span>
      <span class="toggle__knob">
        <span class="toggle__face toggle__face--top"><span class="toggle__indicator"></span></span>
        <span class="toggle__face toggle__face--bottom"><span class="toggle__indicator"></span></span>
      </span>
    </label>
  </div>
</body>
</html>
