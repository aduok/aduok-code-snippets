<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADUOK — Brand &amp; Digital Design Studio</title>
<style>
  :root{
    --blue: #1c17ff;
    --blue-deep: #120fd6;
    --ink: #060424;
    --paper: #f4f2ff;
    --yellow: #f4ff3a;
    --line: rgba(244,242,255,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--blue);
    overflow:hidden;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color:var(--paper);
  }

  body{
    position:relative;
    background:
      radial-gradient(circle at 50% 46%, rgba(255,255,255,0.05), transparent 55%),
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 64px),
      var(--blue);
  }

  /* ---------- NAV ---------- */
  .nav{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:30px 40px;
    z-index:50;
    pointer-events:none;
  }
  .nav > *{ pointer-events:auto; }

  .logo{
    font-size:22px; font-weight:800; letter-spacing:2px;
  }

  .toggle{
    display:flex; align-items:center; gap:2px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;
    padding:5px;
    backdrop-filter: blur(6px);
  }
  .toggle button{
    border:none; cursor:pointer;
    background:transparent;
    color:rgba(244,242,255,0.55);
    font-size:11px; font-weight:700; letter-spacing:1.5px;
    padding:9px 20px;
    border-radius:999px;
    font-family:inherit;
    transition: all .35s ease;
  }
  .toggle button.active{
    background:var(--paper);
    color:var(--ink);
  }

  .nav-links{
    display:flex; align-items:center; gap:34px;
    font-size:11px; font-weight:700; letter-spacing:1.5px;
  }
  .nav-links a{
    color:var(--paper); text-decoration:none; opacity:.85;
    transition:opacity .25s;
  }
  .nav-links a:hover{ opacity:1; }
  .nav-links .lang{ opacity:.6; }

  /* ---------- SCROLL HINT ---------- */
  .scroll-hint{
    position:fixed; top:170px; left:40px; z-index:50;
    display:flex; align-items:center; gap:12px;
  }
  .scroll-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 0 0 rgba(244,255,58,.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(244,255,58,.55); }
    70%{ box-shadow:0 0 0 10px rgba(244,255,58,0); }
    100%{ box-shadow:0 0 0 0 rgba(244,255,58,0); }
  }
  .scroll-pill{
    border:1px solid rgba(255,255,255,0.4);
    border-radius:999px;
    padding:8px 18px;
    font-size:10px; font-weight:700; letter-spacing:2px;
    color:rgba(244,242,255,0.8);
  }

  /* ---------- FOOTER ---------- */
  .footer{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 40px;
    font-size:10.5px; font-weight:700; letter-spacing:1.5px;
    color:rgba(244,242,255,0.75);
    z-index:50;
    pointer-events:none;
  }
  .footer a{ pointer-events:auto; color:var(--paper); text-decoration:underline; }
  .counter{ font-variant-numeric: tabular-nums; }

  /* ---------- STAGE ---------- */
  .stage{
    position:fixed; inset:0;
    perspective: 1800px;
  }

  .ring-field{
    position:absolute; inset:0;
    transform-style:preserve-3d;
  }

  .card{
    position:absolute;
    top:50%; left:50%;
    width:150px;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);
    will-change: transform, opacity;
    background:#000;
    cursor:pointer;
  }
  .card:hover{ filter:brightness(1.08); }
  .card img{
    display:block; width:100%; height:100%; object-fit:cover;
  }
  .card .tag{
    position:absolute; bottom:8px; left:8px;
    font-size:8px; font-weight:800; letter-spacing:1px;
    background:rgba(6,4,36,0.55);
    padding:3px 7px; border-radius:4px;
    backdrop-filter: blur(3px);
  }

  /* ---------- CENTERPIECE ---------- */
  .core-wrap{
    position:absolute; top:50%; left:50%;
    width:0; height:0;
    transform-style:preserve-3d;
  }
  .core{
    position:absolute; top:0; left:0;
    transform-style:preserve-3d;
    animation: spin-core 26s linear infinite;
  }
  @keyframes spin-core{
    from{ transform: rotateY(0deg) rotateX(8deg); }
    to{ transform: rotateY(360deg) rotateX(8deg); }
  }
  .link{
    position:absolute; top:-9px; left:-32px;
    width:64px; height:18px;
    border-radius:9px;
    background: linear-gradient(160deg, #ffffff 0%, #c7cbe6 35%, #8489bd 55%, #ffffff 78%, #b9bde3 100%);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.9), inset 0 -3px 4px rgba(20,20,60,0.4), 0 6px 14px rgba(0,0,0,0.35);
  }

  .core-label{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:10px; font-weight:800; letter-spacing:4px;
    color:rgba(244,242,255,0.35);
    white-space:nowrap;
    pointer-events:none;
  }

  /* ---------- VIEWER OVERLAY (click a card to focus it in the center) ---------- */
  .viewer{
    position:fixed; inset:0;
    z-index:900;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,4,36,0.55);
    backdrop-filter: blur(10px);
    opacity:0;
    pointer-events:none;
    transition: opacity .35s ease;
  }
  .viewer.is-open{
    opacity:1;
    pointer-events:auto;
  }
  .viewer-frame{
    position:relative;
    width:min(70vw, 520px);
    aspect-ratio: 3 / 4;
    transform: scale(0.85);
    transition: transform .4s cubic-bezier(.22,.61,.36,1);
  }
  .viewer.is-open .viewer-frame{ transform: scale(1); }
  .viewer-media{
    position:absolute; inset:0;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    box-shadow:
      0 40px 90px rgba(4,2,40,0.6),
      0 0 0 1px rgba(255,255,255,0.12),
      0 0 0 10px rgba(255,255,255,0.04);
  }
  .viewer-frame img{
    display:block; width:100%; height:100%; object-fit:cover;
  }
  .viewer-caption{
    position:absolute; left:18px; bottom:16px; z-index:2;
    display:flex; align-items:center; gap:10px;
  }
  .viewer-caption .idx{
    font-size:10px; font-weight:800; letter-spacing:1.5px;
    background:rgba(6,4,36,0.55);
    padding:5px 10px; border-radius:5px;
    backdrop-filter: blur(4px);
  }
  .viewer-caption .title{
    font-size:13px; font-weight:800; letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
  .viewer-close{
    position:absolute; top:-46px; right:0;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.08);
    color:var(--paper);
    font-size:16px; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .25s ease;
  }
  .viewer-close:hover{ background:rgba(255,255,255,0.2); }

  @media (max-width: 720px){
    .viewer-frame{ width:min(84vw, 340px); }
    .viewer-close{ top:-44px; width:30px; height:30px; }
  }

  @media (max-width: 720px){
    .nav{ padding:20px 20px; }
    .logo{ font-size:17px; }
    .toggle button{ padding:7px 13px; font-size:9.5px; }
    .nav-links{ gap:16px; font-size:9px; }
    .scroll-hint{ top:130px; left:20px; }
    .footer{ padding:18px 20px; font-size:9px; }
    .card{ width:96px; }
    .link{ width:40px; height:11px; top:-5.5px; left:-20px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="logo">ADUOK</div>
    <div class="toggle">
      <button id="btn-rings" class="active">RINGS</button>
      <button id="btn-spiral">SPIRAL</button>
    </div>
    <div class="nav-links">
      <a href="#">STUDIO</a>
      <a href="#">CONTACT</a>
      <a href="#" class="lang">IT / EN</a>
    </div>
  </nav>

  <div class="scroll-hint">
    <div class="scroll-dot"></div>
    <div class="scroll-pill">SCROLL</div>
  </div>

  <div class="stage">
    <div class="ring-field" id="ringField"></div>

    <div class="core-wrap">
      <div class="core" id="core"></div>
      <div class="core-label">SIGNATURE PIECE</div>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <div class="viewer-frame">
      <div class="viewer-media">
        <img id="viewerImg" src="" alt="selected work">
        <div class="viewer-caption">
          <div class="idx" id="viewerIdx">01</div>
          <div class="title" id="viewerTitle">Identity</div>
        </div>
      </div>
      <div class="viewer-close" id="viewerClose">&times;</div>
    </div>
  </div>

  <footer class="footer">
    <div>BRAND &amp; DIGITAL DESIGN STUDIO</div>
    <div><span class="counter" id="counter">01 / 14</span> selected <a href="#">Works</a></div>
    <div>© 2026</div>
  </footer>

<script>
(function(){
  // ---------- dummy image set ----------
  const seeds = [11,12,13,15,16,17,20,21,22,26,28,29,30,32];
  const labels = ["Identity","Motion","Editorial","Type","Packaging","Digital","Print","Set Design","Art Direction","Web","Sound","Rebrand","Object","Campaign"];
  const N = seeds.length;

  const field = document.getElementById('ringField');
  const cards = [];

  seeds.forEach((seed, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const imgUrl = `https://picsum.photos/seed/kyx${seed}/340/440`;
    card.innerHTML = `<img src="${imgUrl}" alt="work"><div class="tag">${labels[i]}</div>`;
    card.addEventListener('click', ()=> openViewer(i, imgUrl));
    field.appendChild(card);
    cards.push(card);
  });

  // ---------- layout engines ----------
  let mode = 'rings';      // 'rings' | 'spiral'
  let angle = 0;            // global rotation offset, driven by scroll
  let targetAngle = 0;
  let raf = null;

  function layout(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    const rx = Math.min(w*0.46, 760);
    const ry = Math.min(h*0.42, 430);

    cards.forEach((card, i)=>{
      const baseA = (360 / N) * i;
      let x, y, scale, z, rot, opacity;

      if(mode === 'rings'){
        const a = (baseA + angle) * Math.PI/180;
        x = Math.cos(a) * rx;
        y = Math.sin(a) * ry;
        const depth = Math.cos(a); // -1 back .. 1 front
        scale = 0.62 + (depth+1)/2 * 0.55;
        z = depth * 120;
        rot = Math.sin(a) * 14;
        opacity = 0.35 + (depth+1)/2 * 0.65;
      } else {
        // spiral: same angle drives inward/outward breathing spiral
        const turns = 2.4;
        const t = i / N;
        const a = (baseA*turns/360*360 + angle*1.4) * Math.PI/180;
        const spiralR = (0.18 + t*0.9);
        x = Math.cos(a) * rx * spiralR;
        y = Math.sin(a) * ry * spiralR;
        const depth = Math.cos(a);
        scale = 0.5 + t*0.75;
        z = depth * 80 - t*40;
        rot = Math.sin(a) * 20;
        opacity = 0.3 + t*0.7;
      }

      card.style.zIndex = Math.round(1000 + z);
      card.style.opacity = opacity.toFixed(2);
      card.style.transform =
        `translate3d(${x - 75}px, ${y - 98}px, ${z}px) scale(${scale}) rotate(${rot.toFixed(1)}deg)`;
      card.style.height = '196px';
    });

    document.getElementById('counter').textContent =
      String((Math.round(-angle/ (360/N)) % N + N) % N + 1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  }

  function buildCore(){
    const core = document.getElementById('core');
    core.innerHTML = '';
    const segs = 46;
    const radius = 118;
    for(let i=0;i<segs;i++){
      const link = document.createElement('div');
      link.className = 'link';
      const a = (360/segs)*i;
      link.style.transform = `rotateZ(${a}deg) translateX(${radius}px) rotateY(${(i%2)*40 - 20}deg)`;
      core.appendChild(link);
    }
  }
  buildCore();

  // ---------- interaction: wheel / touch rotates the ring ----------
  window.addEventListener('wheel', (e)=>{
    targetAngle += e.deltaY * 0.06;
  }, {passive:true});

  let touchStartY = null;
  window.addEventListener('touchstart', (e)=>{ touchStartY = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchmove', (e)=>{
    if(touchStartY === null) return;
    const dy = touchStartY - e.touches[0].clientY;
    targetAngle += dy * 0.15;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});

  function tick(){
    angle += (targetAngle - angle) * 0.08;
    layout();
    requestAnimationFrame(tick);
  }
  tick();

  window.addEventListener('resize', layout);

  // ---------- toggle ----------
  const btnRings = document.getElementById('btn-rings');
  const btnSpiral = document.getElementById('btn-spiral');
  btnRings.addEventListener('click', ()=>{
    mode='rings'; btnRings.classList.add('active'); btnSpiral.classList.remove('active');
  });
  btnSpiral.addEventListener('click', ()=>{
    mode='spiral'; btnSpiral.classList.add('active'); btnRings.classList.remove('active');
  });

  // ---------- viewer: click a ring image to view it centered, ring stays as-is ----------
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');
  const viewerIdx = document.getElementById('viewerIdx');
  const viewerTitle = document.getElementById('viewerTitle');
  const viewerClose = document.getElementById('viewerClose');

  function openViewer(i, srcUrl){
    viewerImg.src = srcUrl;
    viewerIdx.textContent = String(i+1).padStart(2,'0');
    viewerTitle.textContent = labels[i];
    viewer.classList.add('is-open');
  }
  function closeViewer(){
    viewer.classList.remove('is-open');
  }
  viewerClose.addEventListener('click', closeViewer);
  viewer.addEventListener('click', (e)=>{
    if(e.target === viewer) closeViewer();
  });
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeViewer();
  });

})();
</script>
</body>
</html>
