<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wind Scatter Text</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #0b0b0d;
    --fg: #f4f3ef;
    --muted: #6a6a70;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
  }

  .spacer {
    height: 30vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stage {
    min-height: 180vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 32vh;
  }

  .fly-text {
    position: relative;
    max-width: 90vw;
    text-align: center;
    font-size: clamp(2.8rem, 8.5vw, 7rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .fly-char {
    will-change: transform, opacity;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <div class="spacer">scroll down ↓</div>

  <section class="stage">
    <h1
      class="fly-text"
      id="windTarget"
      data-wind-angle="30"
      data-wind-strength="480"
      data-scatter="90"
      data-max-rotation="420"
      data-stagger="0.55"
      data-depth="160"
      data-order="random"
      data-randomness="0"
      data-gustiness="90"
      data-gust-frequency="1"
      data-gust-phase-spread="1"
      data-reverse="false"
      data-animation-duration="1"
    >Words fall apart when you scroll</h1>
  </section>

  <div class="spacer">end</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
  (function () {
    'use strict';

    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
      console.error('[fly-text] GSAP or ScrollTrigger failed to load.');
      return;
    }

    gsap.registerPlugin(ScrollTrigger);

    /**
     * Default tuning values. Any of these can be overridden per-element via
     * matching `data-*` attributes (e.g. `data-wind-angle="45"`).
     */
    const DEFAULTS = Object.freeze({
      windAngle: 25,        // degrees: 0 = right, 90 = up, 180 = left
      windStrength: 400,     // px travelled along the wind direction
      scatter: 80,           // px random perpendicular deviation
      maxRotation: 360,      // degrees: max rotation on any axis
      stagger: 0.5,          // 0–1: spread of per-letter start times
      depth: 120,            // px: max Z movement
      reverse: false,        // true = scroll reveals text, false = scatters it
      order: 'random',       // 'random' | 'ltr' | 'rtl' | 'outward'
      randomness: 0,         // 0 = ordered stagger, 1 = fully random
      gustiness: 0,          // px lateral drift perpendicular to wind
      gustFrequency: 1,      // sine cycles during flight
      gustPhaseSpread: 1,    // 0–1: how much gust phase spreads across chars
      startY: null,          // null = mode default (.85 reverse, .65 forward)
      animationDuration: 1,  // fraction of scroll range the animation occupies
      easing: null,
    });

    const CHAR_PROP_SCHEMA = {
      windAngle: parseFloat,
      windStrength: parseFloat,
      scatter: parseFloat,
      maxRotation: parseFloat,
      stagger: parseFloat,
      depth: parseFloat,
      reverse: (v) => v === 'true',
      order: (v) => v,
      randomness: parseFloat,
      gustiness: parseFloat,
      gustFrequency: parseFloat,
      gustPhaseSpread: parseFloat,
      startY: parseFloat,
      animationDuration: parseFloat,
      easing: (v) => v,
    };

    // ---------------------------------------------------------------------
    // Deterministic PRNG — keeps the scatter pattern stable across reloads
    // and ResizeObserver-triggered rebuilds.
    // ---------------------------------------------------------------------
    function createPrng(seed) {
      let a = seed >>> 0;
      let b = 0x9e3779b9;
      let c = 0x243f6a88;
      let d = 0xb7e15162;

      function next() {
        a |= 0; b |= 0; c |= 0; d |= 0;
        const t = (a + b | 0) + d | 0;
        d = (d + 1) | 0;
        a = b ^ (b >>> 9);
        b = (c + (c << 3)) | 0;
        c = (c << 21) | (c >>> 11);
        c = (c + t) | 0;
        return (t >>> 0) / 4294967296; // → [0, 1)
      }

      for (let i = 0; i < 8; i++) next(); // warm up
      return next;
    }

    const prng = createPrng(1337);
    const randomBetween = (min, max) => min + prng() * (max - min);
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    // ---------------------------------------------------------------------
    // DOM setup
    // ---------------------------------------------------------------------

    /**
     * Builds the accessible DOM structure for one fly-text element:
     *   - a visually-hidden span carrying the real text (for screen readers)
     *   - a hidden placeholder used purely to measure character positions
     *   - an absolutely-positioned overlay that receives the animated glyphs
     */
    function buildStructure(el, text) {
      if (getComputedStyle(el).position === 'static') {
        el.style.position = 'relative';
      }
      el.textContent = '';

      const screenReaderText = document.createElement('span');
      screenReaderText.className = 'visually-hidden';
      screenReaderText.textContent = text;
      el.appendChild(screenReaderText);

      const placeholder = document.createElement('span');
      placeholder.setAttribute('aria-hidden', 'true');
      placeholder.style.cssText = 'visibility:hidden; pointer-events:none; user-select:none;';
      placeholder.textContent = text;
      el.appendChild(placeholder);

      const overlay = document.createElement('span');
      overlay.setAttribute('aria-hidden', 'true');
      overlay.style.cssText =
        'position:absolute; top:0; left:0; width:100%; height:100%; overflow:visible; pointer-events:none;';
      el.appendChild(overlay);

      return { placeholder, overlay };
    }

    /**
     * Measures each character's true rendered box (via the Range API) and
     * creates an absolutely-positioned span for it inside the overlay.
     * Also stores a normalised x position (0 = leftmost, 1 = rightmost)
     * so ordering modes work correctly across wrapped, multi-line text.
     */
    function measureAndCreateChars(el, text, placeholder, overlay) {
      const containerRect = el.getBoundingClientRect();
      const textNode = placeholder.firstChild;
      const chars = [];

      for (let i = 0; i < text.length; i++) {
        if (text[i] === ' ') continue;

        const range = document.createRange();
        range.setStart(textNode, i);
        range.setEnd(textNode, i + 1);
        const box = range.getBoundingClientRect();

        const span = document.createElement('span');
        span.textContent = text[i];
        span.classList.add('fly-char');
        span.style.cssText = [
          'position:absolute',
          `left:${box.left - containerRect.left}px`,
          `top:${box.top - containerRect.top}px`,
          `width:${box.width}px`,
          `height:${box.height}px`,
          'white-space:nowrap',
        ].join(';');

        span._x = box.left - containerRect.left;
        overlay.appendChild(span);
        chars.push(span);
      }

      const xs = chars.map((c) => c._x);
      const xMin = Math.min(...xs);
      const xRange = Math.max(...xs) - xMin || 1;
      chars.forEach((c) => {
        c._normX = (c._x - xMin) / xRange;
      });

      return chars;
    }

    // ---------------------------------------------------------------------
    // Timeline construction
    // ---------------------------------------------------------------------

    /** Computes when (0–stagger) a character's flight animation should start. */
    function getCharStartTime(char, order, stagger, randomness) {
      const x = char._normX;
      let ordered;

      switch (order) {
        case 'ltr':
          ordered = x * stagger;
          break;
        case 'rtl':
          ordered = (1 - x) * stagger;
          break;
        case 'outward':
          ordered = (1 - Math.abs(x - 0.5) * 2) * stagger;
          break;
        default:
          return randomBetween(0, stagger);
      }

      return ordered * (1 - randomness) + randomBetween(0, stagger) * randomness;
    }

    /** Builds the paused GSAP timeline that ScrollTrigger will scrub through. */
    function buildTimeline(chars, config) {
      const {
        reverse, windAngle, windStrength, scatter, maxRotation, depth,
        order, stagger, randomness, gustiness, gustFrequency, gustPhaseSpread, easing,
      } = config;

      const timeline = gsap.timeline({ paused: true });

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        const from = reverse ? { opacity: 0 } : { opacity: 1 };
        const to = reverse ? { opacity: 1 } : { opacity: 0 };
        timeline.fromTo(chars, from, { ...to, duration: 1 });
        return timeline;
      }

      const windRadians = (windAngle * Math.PI) / 180;
      const windX = Math.cos(windRadians);
      const windY = -Math.sin(windRadians); // negate CSS Y for a natural "upward" wind
      const perpX = Math.sin(windRadians);  // perpendicular axis, used for gust drift
      const perpY = Math.cos(windRadians);

      const sharedGustAmp = gustiness > 0
        ? randomBetween(0.1, 1.0) * gustiness * (prng() > 0.5 ? 1 : -1)
        : 0;

      gsap.set(chars, { transformPerspective: 500 });

      chars.forEach((char, i) => {
        const startTime = getCharStartTime(char, order, stagger, randomness);
        const duration = randomBetween(1 - randomness * 0.5, 1 + randomness * 0.5);

        const scatterAngle = randomBetween(0, Math.PI * 2);
        const scatterDist = randomBetween(0, scatter);

        const flightX = windX * windStrength + Math.cos(scatterAngle) * scatterDist;
        const flightY = windY * windStrength + Math.sin(scatterAngle) * scatterDist;
        const flightZ = randomBetween(-depth, depth);

        const rotationX = randomBetween(-maxRotation, maxRotation);
        const rotationY = randomBetween(-maxRotation * 0.7, maxRotation * 0.7);
        const rotationZ = randomBetween(-maxRotation * 0.3, maxRotation * 0.3);

        if (gustiness > 0) {
          animateCharWithGust(timeline, char, {
            startTime, duration, easing, reverse,
            flightX, flightY, flightZ, rotationX, rotationY, rotationZ,
            gustFrequency, gustPhaseSpread, sharedGustAmp, gustiness,
            index: i, total: chars.length, perpX, perpY,
          });
        } else {
          animateCharSimple(timeline, char, {
            startTime, duration, easing, reverse,
            flightX, flightY, flightZ, rotationX, rotationY, rotationZ,
          });
        }
      });

      const animationDuration = parseFloat(config.animationDuration);
      if (animationDuration > 0 && animationDuration < 1) {
        // Stretch the timeline so the content occupies only this fraction
        // of the total scroll range (e.g. 0.2 → finishes within first 20%).
        timeline.call(() => {}, [], timeline.duration() / animationDuration);
      }

      return timeline;
    }

    /** Simple from/to tween — used when there's no gust wobble to animate manually. */
    function animateCharSimple(timeline, char, p) {
      const scattered = {
        x: p.flightX, y: p.flightY, z: p.flightZ,
        rotationX: p.rotationX, rotationY: p.rotationY, rotationZ: p.rotationZ,
        opacity: 0,
      };
      const natural = {
        x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, rotationZ: 0, opacity: 1,
      };
      const [from, to] = p.reverse ? [scattered, natural] : [natural, scattered];

      timeline.fromTo(char, from, {
        ...to,
        duration: p.duration,
        ease: p.easing ?? (p.reverse ? 'power3.out' : 'power3.in'),
      }, p.startTime);
    }

    /**
     * Manually-driven tween via a proxy object, so we can layer a de-trended
     * sine wobble (perpendicular to the wind) on top of the linear flight path.
     */
    function animateCharWithGust(timeline, char, p) {
      const syncPhase = Math.PI * p.gustFrequency * p.startTime;
      const indexPhase = (p.index / Math.max(1, p.total - 1)) * Math.PI * 2;
      const phase = lerp(syncPhase, indexPhase, p.gustPhaseSpread);

      const individualAmp = randomBetween(0.1, 1.0) * p.gustiness * (prng() > 0.5 ? 1 : -1);
      const amp = lerp(p.sharedGustAmp, individualAmp, p.gustPhaseSpread);

      // De-trend the sine so it's exactly 0 at both t=0 and t=1, regardless of
      // phase: subtract the linear ramp between the two endpoint values.
      const s0 = Math.sin(phase);
      const s1 = Math.sin(Math.PI * p.gustFrequency + phase);
      const gustOffset = (t) =>
        amp * (Math.sin(Math.PI * p.gustFrequency * t + phase) - s0 - t * (s1 - s0));

      const poseAt = (t) => {
        const s = p.reverse ? 1 - t : t;
        return {
          x: s * p.flightX + p.perpX * gustOffset(t),
          y: s * p.flightY + p.perpY * gustOffset(t),
          z: s * p.flightZ,
          rotationX: p.rotationX * s,
          rotationY: p.rotationY * s,
          rotationZ: p.rotationZ * s,
          opacity: clamp01((1 - s) / 0.6), // fades over the last 60% of the fade window
        };
      };

      gsap.set(char, poseAt(0)); // avoid a first-frame jump to the wrong position

      const proxy = { t: 0 };
      timeline.to(proxy, {
        t: 1,
        duration: p.duration,
        ease: p.easing || 'power3.in',
        immediateRender: true,
        onUpdate() {
          gsap.set(char, poseAt(proxy.t));
        },
      }, p.startTime);
    }

    // ---------------------------------------------------------------------
    // Per-element config resolution
    // ---------------------------------------------------------------------

    /** Merges `data-*` attributes over DEFAULTS, coercing each to its expected type. */
    function resolveConfig(dataset) {
      const config = { ...DEFAULTS };
      for (const [key, coerce] of Object.entries(CHAR_PROP_SCHEMA)) {
        if (dataset[key] !== undefined) {
          config[key] = coerce(dataset[key]);
        }
      }
      return config;
    }

    // ---------------------------------------------------------------------
    // Element bootstrap
    // ---------------------------------------------------------------------

    function initFlyText(el) {
      const config = resolveConfig(el.dataset);
      const text = el.textContent.replace(/\s+/g, ' ').trim();
      const { placeholder, overlay } = buildStructure(el, text);

      let scrollTrigger = null;
      let timeline = null;

      function setup() {
        if (scrollTrigger) scrollTrigger.kill();
        if (timeline) timeline.kill();
        overlay.innerHTML = '';

        const chars = measureAndCreateChars(el, text, placeholder, overlay);
        if (!chars.length) return;

        timeline = buildTimeline(chars, config);

        const startPercent = Math.round((config.startY ?? (config.reverse ? 0.85 : 0.65)) * 100);

        scrollTrigger = ScrollTrigger.create({
          trigger: el,
          start: `top ${startPercent}%`,
          end: config.reverse ? 'top 20%' : 'bottom top',
          scrub: 1,
          animation: timeline,
        });
      }

      setup();

      // Re-measure and rebuild whenever the element's size actually changes
      // (fonts loading late, container resizing, viewport orientation, etc).
      let resizeTimer;
      let lastWidth = 0;
      let lastHeight = 0;

      const resizeObserver = new ResizeObserver(([entry]) => {
        const { inlineSize: width, blockSize: height } = entry.contentBoxSize[0];
        if (width === lastWidth && height === lastHeight) return;
        lastWidth = width;
        lastHeight = height;

        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(setup, 200);
      });
      resizeObserver.observe(el);
    }

    // Wait for fonts before measuring so character rects use correct metrics.
    document.fonts.ready.then(() => {
      document.querySelectorAll('.fly-text').forEach(initFlyText);
    });
  })();
  </script>
</body>
</html>
